
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>HARIKUPNYC Converter</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f2f2f7;
  color: #111;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
}
main {
  max-width: 520px;
  margin: auto;
  padding: 26px 18px;
}
h1 { text-align: center; font-size: 29px; }
.sub { text-align: center; color: #666; margin-bottom: 22px; }
.card {
  background: white;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 14px;
}
label { font-weight: bold; display: block; margin-bottom: 9px; }
textarea {
  width: 100%;
  height: 105px;
  border: 1px solid #ccc;
  border-radius: 14px;
  padding: 14px;
  font-size: 23px;
  text-transform: uppercase;
}
.result {
  min-height: 65px;
  font-size: 32px;
  font-weight: bold;
  overflow-wrap: anywhere;
  padding: 8px 0;
}
button {
  width: 100%;
  border: 0;
  border-radius: 13px;
  padding: 15px;
  margin-top: 10px;
  font-size: 17px;
  font-weight: bold;
}
.primary { background: #111; color: white; }
.secondary { background: #e5e5ea; color: #111; }
.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 7px;
}
.cell {
  background: #f2f2f7;
  border-radius: 9px;
  padding: 10px 2px;
  text-align: center;
  font-weight: bold;
}
.status { text-align: center; color: green; margin-top: 10px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Letter → Number</h1>
  <div class="sub">HARIKUPNYC Code</div>

  <section class="card">
    <label for="input">Enter letters</label>
    <textarea id="input" placeholder="Type here..." autocapitalize="characters"></textarea>
  </section>

  <section class="card">
    <label>Number</label>
    <div id="output" class="result">—</div>
    <button class="primary" id="copy">Copy Number</button>
    <button class="secondary" id="clear">Clear</button>
    <div id="status" class="status"></div>
  </section>

  <button class="secondary" id="toggle">Unhide Mapping</button>

  <section class="card" id="mapping" hidden>
    <label>Your Letter Mapping</label>
    <div id="grid" class="grid"></div>
  </section>
</main>

<script>
const map = {
  H: "5",
  A: "8",
  R: "2",
  I: "0",
  K: "7",
  U: "3",
  P: "9",
  N: "1",
  Y: "6",
  C: "4"
};

const input = document.getElementById("input");
const output = document.getElementById("output");
const status = document.getElementById("status");
const mapping = document.getElementById("mapping");
const toggle = document.getElementById("toggle");
const grid = document.getElementById("grid");

Object.entries(map).forEach(([letter, number]) => {
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.textContent = letter + " = " + number;
  grid.appendChild(cell);
});

function convert() {
  const letters = input.value.toUpperCase();
  input.value = letters;
  output.textContent =
    [...letters].map(letter => map[letter] ?? letter).join("") || "—";
}

input.addEventListener("input", convert);

document.getElementById("copy").addEventListener("click", async () => {
  if (output.textContent === "—") return;
  try {
    await navigator.clipboard.writeText(output.textContent);
  } catch (error) {
    const temp = document.createElement("textarea");
    temp.value = output.textContent;
    document.body.appendChild(temp);
    temp.select();
    document.execCommand("copy");
    temp.remove();
  }
  status.textContent = "Copied!";
  setTimeout(() => status.textContent = "", 1500);
});

document.getElementById("clear").addEventListener("click", () => {
  input.value = "";
  convert();
  input.focus();
});

toggle.addEventListener("click", () => {
  mapping.hidden = !mapping.hidden;
  toggle.textContent = mapping.hidden ? "Unhide Mapping" : "Hide Mapping";
});

convert();
</script>
</body>
</html>
